name: Build Mobile App

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  install-deps:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Android Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12.0
          packages: |
            build-tools;33.0.2
            platforms;android-33
            ndk;25.2.9519653
          accept-android-sdk-licenses: true

      - name: Auto-accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Prebuild Android Project
        run: |
          if [ ! -d android ]; then
            npx expo prebuild --platform android --clean || true
          fi

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicLink-android-apk
          path: android/app/build/outputs/apk/release/*.apk

  ios-build:
    name: Build iOS App
    runs-on: macos-latest
    needs: install-deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS Project
        run: npx expo prebuild --platform ios --clean || true

      - name: Install CocoaPods
        run: npx pod-install --project-directory=ios || true

      - name: Build iOS Simulator App
        run: |
          xcodebuild -workspace ios/MicLink.xcworkspace \
                     -scheme MicLink \
                     -sdk iphonesimulator \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     derivedDataPath build

      - name: Package iOS App
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r MicLink-ios.app.zip MicLink.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicLink-ios
          path: build/Build/Products/Release-iphonesimulator/MicLink-ios.app.zip
